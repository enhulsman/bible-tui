[package]
name = "bible-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
bible-core = { path = "../bible-core", features = ["wasm"] }
ratzilla = { git = "https://github.com/enhulsman/ratzilla.git", rev = "4a2d91bc42162c6952df936d51b8561657457c89" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlElement", "Storage", "Performance",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
