[package]
name = "bible-native"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bible"
path = "src/main.rs"

[dependencies]
bible-core = { path = "../bible-core" }
ratatui = { version = "0.30", features = ["underline-color", "crossterm"] }
crossterm = "0.29"
color-eyre = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
arboard = "3"
directories = "6"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
quick-xml = "0.37"
serde_json = "1"
