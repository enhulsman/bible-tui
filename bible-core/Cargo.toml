[package]
name = "bible-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
wasm = ["chrono/wasmbind"]

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["all-widgets", "underline-color"] }
textwrap = { version = "0.16", features = ["unicode-width"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.2"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
postcard = { version = "1", features = ["alloc"] }
